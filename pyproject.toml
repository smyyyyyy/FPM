[project]
name = "fpm-benchmark"
version = "0.1.0"
description = "CodeQL alert triage experiment scaffold with structured evidence and LLM-guided evidence retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fpm-bench = "fpm_benchmark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
